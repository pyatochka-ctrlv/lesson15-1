<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пасіка: бліц-вікторина</title>
<style>
:root{
  --ws:#E9EFE2;
  --g:#5BA61F; --gd:#3C7410;          /* розмістити / заповнити */
  --r:#3E9E58; --rd:#28703F;          /* вибрати випадкове положення */
  --rep:#1E6B34; --repd:#11451F;      /* повторити */
  --p:#8B4FD6; --pd:#5E2FA5;          /* створити тварину */
  --honey:#FFC83D;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1108}
body{font-family:"Segoe UI","Trebuchet MS",Arial,sans-serif;user-select:none}
button{font-family:inherit}

#stage{
  position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  display:grid;grid-template-rows:118px 136px 600px 1fr;gap:14px;padding:14px 30px 22px;
  background:
    var(--grassSide) 0 0/64px 64px repeat-x,
    linear-gradient(rgba(38,22,6,.62),rgba(38,22,6,.62)),
    var(--dirt) 0 0/64px 64px;
  image-rendering:pixelated;
}

/* ---------- ШАПКА ---------- */
header{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
.logo{position:relative;display:flex;align-items:center;gap:18px}
.logo-text{
  font:900 66px/1 "Arial Black","Segoe UI Black",Impact,sans-serif;letter-spacing:3px;
  background:linear-gradient(rgba(255,255,255,.18),rgba(0,0,0,.05)),var(--stone) 0 0/48px 48px;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #4a4a4a) drop-shadow(0 3px 0 #2e2e2e) drop-shadow(4px 4px 0 #000);
}
.logo-emoji{font-size:60px;filter:drop-shadow(3px 3px 0 #000);animation:bob 1.4s ease-in-out infinite}
.splash{
  position:absolute;right:-150px;bottom:-14px;color:#FFFF55;font:800 25px/1 "Segoe UI",Arial,sans-serif;
  text-shadow:3px 3px 0 #3F3F15;transform:rotate(-12deg);white-space:nowrap;
  animation:splash .55s ease-in-out infinite alternate;
}
@keyframes splash{from{transform:rotate(-12deg) scale(1)}to{transform:rotate(-12deg) scale(1.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.hotbar{display:flex;gap:6px;padding:6px;background:rgba(0,0,0,.55);border:3px solid #000;margin-left:120px}
.pslot{width:84px;height:84px;position:relative;display:grid;place-items:center;
  background:#8B8B8B;box-shadow:inset 4px 4px 0 #373737,inset -4px -4px 0 #FFFFFF}
.pslot canvas{width:66px;height:66px;image-rendering:pixelated;filter:grayscale(1) brightness(.9);opacity:.6;transition:filter .4s,opacity .4s}
.pslot .z{position:absolute;right:6px;top:2px;color:#fff;font:800 20px Arial;text-shadow:2px 2px 0 #000;animation:zz 2s ease-in-out infinite}
.pslot .n{position:absolute;left:6px;bottom:2px;color:#fff;font:800 20px Arial;text-shadow:2px 2px 0 #3f3f3f}
@keyframes zz{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
.pslot.alive canvas{filter:none;opacity:1;animation:hover 1.1s ease-in-out infinite}
.pslot.alive .z{display:none}
.pslot.wake{z-index:20}
.pslot.wake canvas{animation:flyloop 2s ease-in-out}
@keyframes hover{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
@keyframes flyloop{
  0%{transform:translate(0,0) scale(1)}
  18%{transform:translate(70px,40px) rotate(14deg) scale(1.6)}
  40%{transform:translate(-80px,90px) rotate(-18deg) scale(1.8)}
  62%{transform:translate(-40px,-10px) rotate(10deg) scale(1.5)}
  82%{transform:translate(30px,30px) rotate(-6deg) scale(1.3)}
  100%{transform:translate(0,0) scale(1)}
}
.tools{display:flex;align-items:center;gap:14px}
.steplabel{color:#fff;font:800 26px "Segoe UI",Arial;text-shadow:3px 3px 0 #000;background:rgba(0,0,0,.55);border:3px solid #000;padding:10px 18px}
.keys{color:#e8dcc0;font:700 18px "Segoe UI",Arial;text-shadow:2px 2px 0 #000;line-height:1.3;text-align:right}

/* ---------- MC-кнопки ---------- */
.mc-btn{
  font:800 28px "Segoe UI",Arial,sans-serif;color:#fff;text-shadow:3px 3px 0 #3a3a3a;cursor:pointer;
  background:var(--stone) 0 0/64px 64px;border:3px solid #000;padding:16px 28px;white-space:nowrap;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.5),inset -3px -4px 0 rgba(0,0,0,.5);
}
.mc-btn:hover{background:linear-gradient(rgba(120,140,255,.38),rgba(120,140,255,.38)),var(--stone) 0 0/64px 64px;color:#FFFFA0}
.mc-btn:active{transform:translateY(2px)}
.mc-btn.green{background:linear-gradient(rgba(60,190,60,.6),rgba(60,190,60,.6)),var(--stone) 0 0/64px 64px}
.mc-btn.green:hover{background:linear-gradient(rgba(90,230,90,.6),rgba(90,230,90,.6)),var(--stone) 0 0/64px 64px}
.mc-btn.honey{background:linear-gradient(rgba(240,170,30,.65),rgba(240,170,30,.65)),var(--stone) 0 0/64px 64px}
.mc-btn.small{font-size:30px;padding:8px 14px}
.mc-btn[hidden]{display:none}

/* ---------- ПИТАННЯ ---------- */
#qbox{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:rgba(18,10,2,.74);border:4px solid #000;box-shadow:inset 3px 3px 0 rgba(255,255,255,.12),inset -3px -3px 0 rgba(0,0,0,.4);
  padding:8px 40px;
}
#qtag{color:var(--honey);font:800 22px "Segoe UI",Arial;text-shadow:2px 2px 0 #3a2400;letter-spacing:1px;text-transform:uppercase}
#qtext{margin:6px 0 0;color:#fff;font:800 40px/1.2 "Segoe UI",Arial,sans-serif;text-shadow:3px 3px 0 #3a2a10}

/* ---------- ЦЕНТР ---------- */
main{display:grid;grid-template-columns:544px 1fr;gap:26px;min-height:0}
.meadow-wrap{
  position:relative;padding:8px;border:4px solid #000;
  background:var(--planks) 0 0/64px 64px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),inset -3px -3px 0 rgba(0,0,0,.4);
  display:flex;flex-direction:column;gap:8px;
}
#meadow{display:block;width:520px;height:520px;image-rendering:pixelated;border:3px solid #2b1a0a}
#counter{
  height:46px;display:flex;align-items:center;justify-content:center;text-align:center;
  background:rgba(0,0,0,.72);color:#fff;font:700 21px "Segoe UI",Arial;border:2px solid #000;padding:0 10px;
}
#counter b{color:var(--honey)}
.bubble{
  position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:4;width:420px;text-align:center;
  background:#fff;border:4px solid #000;box-shadow:6px 6px 0 rgba(0,0,0,.45);padding:18px 16px;
  font:800 30px/1.25 "Segoe UI",Arial;color:#2a2a2a;animation:pop .35s ease-out;
}
.bubble small{display:block;font-size:22px;font-weight:600;color:#555;margin-top:6px}
.bubble:after{content:"";position:absolute;left:50%;bottom:-22px;width:22px;height:22px;background:#fff;border:4px solid #000;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.bubble[hidden]{display:none}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

#right{
  position:relative;border:4px solid #000;padding:24px 30px;display:flex;flex-direction:column;gap:22px;
  background:radial-gradient(#cdd8c2 1.6px,transparent 1.8px) 0 0/26px 26px,var(--ws);
  box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #9aa58f;overflow:hidden;
}
.code{position:relative;display:flex;align-items:flex-start;gap:20px}
.runtag{position:absolute;right:0;top:0;background:#fff;border:3px solid #333;border-radius:8px;padding:8px 14px;font:800 22px "Segoe UI";color:#333}
.opts{display:flex;flex-direction:column;gap:18px}
.opts.row{flex-direction:row;gap:40px;justify-content:center;margin-top:auto;margin-bottom:auto}
.opt{display:flex;align-items:center;gap:18px;background:none;border:0;padding:4px;cursor:pointer;text-align:left;transition:transform .15s,opacity .3s}
.opt:hover{transform:translateX(8px)}
.opts.row .opt:hover{transform:translateY(-4px)}
.letter{
  flex:none;width:58px;height:58px;display:grid;place-items:center;color:#fff;font:900 30px "Segoe UI",Arial;text-shadow:3px 3px 0 #333;
  background:var(--stone) 0 0/64px 64px;border:3px solid #000;box-shadow:inset 3px 3px 0 rgba(255,255,255,.5),inset -3px -3px 0 rgba(0,0,0,.5);
}
.card{
  flex:1;font:700 27px/1.3 "Segoe UI",Arial,sans-serif;color:#2a2a2a;background:#C6C6C6;padding:16px 24px;
  border:3px solid #000;box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #555;
}
.opt:hover .card{background:#D6D9EE}
.tf{
  min-width:330px;text-align:center;font:900 44px "Segoe UI",Arial;color:#fff;text-shadow:3px 3px 0 #333;padding:30px 40px;
  background:var(--stone) 0 0/64px 64px;border:4px solid #000;box-shadow:inset 4px 4px 0 rgba(255,255,255,.5),inset -4px -5px 0 rgba(0,0,0,.5);
}
.tf.yes{background:linear-gradient(rgba(60,170,70,.55),rgba(60,170,70,.55)),var(--stone) 0 0/64px 64px}
.tf.no{background:linear-gradient(rgba(200,60,50,.5),rgba(200,60,50,.5)),var(--stone) 0 0/64px 64px}

.opt.trying .blk,.opt.trying .card,.opt.trying .tf{box-shadow:0 0 0 5px #FFD33D,0 0 22px 6px rgba(255,210,60,.7)}
.opt.correct .blk,.opt.correct .card,.opt.correct .tf{box-shadow:0 0 0 4px #fff,0 0 0 10px #3EE03E,0 0 40px 14px rgba(80,255,80,.8);animation:glow 1.2s ease-in-out infinite}
.opt.correct .letter{background:linear-gradient(rgba(60,210,60,.75),rgba(60,210,60,.75)),var(--stone) 0 0/64px 64px}
.opt.wrong{opacity:.78}
.opt.wrong .blk,.opt.wrong .card,.opt.wrong .tf{box-shadow:0 0 0 5px #E53935;animation:shake .4s}
.opt.wrong .letter{background:linear-gradient(rgba(220,50,40,.7),rgba(220,50,40,.7)),var(--stone) 0 0/64px 64px}
.opt.dim{opacity:.4}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#right.thinking .letter{animation:think 1s ease-in-out infinite}
@keyframes think{0%,100%{transform:scale(1)}50%{transform:scale(1.18) rotate(-6deg)}}

/* ---------- БЛОКИ MakeCode ---------- */
.blk{
  position:relative;display:inline-flex;align-items:center;flex-wrap:wrap;gap:10px;row-gap:8px;
  color:#fff;font:700 24px/1.2 "Segoe UI",Arial,sans-serif;padding:12px 18px;min-height:64px;
  background:var(--c);border:2px solid var(--cd);border-radius:7px;
}
.blk.g{--c:var(--g);--cd:var(--gd)}
.blk.p{--c:var(--p);--cd:var(--pd)}
.blk::before{content:"";position:absolute;top:-2px;left:22px;width:30px;height:9px;background:var(--ws);border:2px solid var(--cd);border-top:0;border-radius:0 0 9px 9px}
.blk::after{content:"";position:absolute;top:100%;left:22px;width:30px;height:11px;margin-top:-2px;background:var(--c);border:2px solid var(--cd);border-top:0;border-radius:0 0 9px 9px}
.num{display:inline-block;background:#fff;color:#222;border-radius:999px;padding:3px 16px;font:700 23px/1.2 "Segoe UI",Arial;border:2px solid rgba(0,0,0,.18);transition:transform .25s}
.num.bump{transform:scale(1.6);background:#FFF39A}
.pick{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:8px;padding:2px 8px;font-size:27px;line-height:1.2;color:#666;border:2px solid rgba(0,0,0,.18)}
.pick i{font:700 14px Arial;font-style:normal}
.rep{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px;row-gap:6px;background:var(--r);border:2px solid var(--rd);border-radius:28px;padding:6px 14px}
.cb{display:inline-flex;flex-direction:column;align-items:flex-start;--c:var(--rep);--cd:var(--repd)}
.cb-top{position:relative;display:flex;align-items:center;gap:10px;color:#fff;font:700 24px "Segoe UI",Arial;padding:12px 20px;
  background:var(--c);border:2px solid var(--cd);border-bottom:0;border-radius:7px 7px 0 0;min-width:340px}
.cb-top::before{content:"";position:absolute;top:-2px;left:22px;width:30px;height:9px;background:var(--ws);border:2px solid var(--cd);border-top:0;border-radius:0 0 9px 9px}
.cb-mid{display:flex;align-items:stretch}
.cb-arm{width:26px;background:var(--c);border-left:2px solid var(--cd)}
.cb-slot{padding:12px 0 16px;min-height:90px;display:flex;align-items:center}
.cb-bot{position:relative;width:240px;height:28px;background:var(--c);border:2px solid var(--cd);border-top:0;border-radius:0 0 7px 7px}
.cb-bot::after{content:"";position:absolute;top:100%;left:22px;width:30px;height:11px;margin-top:0;background:var(--c);border:2px solid var(--cd);border-top:0;border-radius:0 0 9px 9px}
.slot-ph{margin-left:4px;border:3px dashed #8B9C7A;border-radius:8px;color:#5f6f50;font:700 24px "Segoe UI";padding:14px 26px;background:rgba(255,255,255,.5)}
#slot.filled .blk{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}

/* ---------- НИЗ ---------- */
footer{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
#think{grid-column:1}#msg{grid-column:2}#next{grid-column:3}
#think[hidden]+#msg{grid-column:1/3}
#msg{
  min-height:104px;display:flex;flex-direction:column;justify-content:center;gap:4px;
  background:rgba(0,0,0,.66);border:4px solid #000;color:#fff;font:600 26px/1.3 "Segoe UI",Arial;padding:12px 26px;
  text-shadow:2px 2px 0 #000;
}
#msg b{font-weight:800}
#msg.ok{border-color:#3EE03E;color:#C6FFAE}
#msg.bad{border-color:#FFB300}
#msg.bad b{color:#FFD25A}
#msg .sub{font-size:24px;color:#f0e6d0}

/* ---------- ФІНАЛ ---------- */
#final{
  position:absolute;left:30px;right:30px;top:146px;bottom:22px;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px;
  background:linear-gradient(rgba(24,14,4,.94),rgba(24,14,4,.94)),var(--dirt) 0 0/64px 64px;border:4px solid #000;
}
#final[hidden]{display:none}
#final h2{margin:0;font:900 56px/1.1 "Arial Black","Segoe UI Black",Arial;color:#FFE14D;text-shadow:4px 4px 0 #5a3a00;text-align:center}
#fcv{width:1000px;height:480px;image-rendering:pixelated;border:4px solid #000}
.chips{display:flex;gap:18px}
.chip{background:#C6C6C6;border:3px solid #000;box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #555;padding:12px 20px;font:700 24px "Segoe UI";color:#2a2a2a}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="logo">
      <span class="logo-text">БЛІЦ-ВІКТОРИНА</span><span class="logo-emoji">🐝</span>
      <div class="splash">Пасіка: перевір уважність!</div>
    </div>
    <div class="hotbar" id="hotbar"></div>
    <div class="tools">
      <div class="keys">← назад · → далі<br>R — спочатку</div>
      <div class="steplabel" id="steplabel">Питання 1 / 4</div>
      <button class="mc-btn small" id="mute" title="Звук">🔊</button>
    </div>
  </header>

  <section id="qbox">
    <div id="qtag"></div>
    <h1 id="qtext"></h1>
  </section>

  <main>
    <div class="meadow-wrap">
      <canvas id="meadow" width="520" height="520"></canvas>
      <div id="counter"></div>
      <div class="bubble" id="bubble" hidden>🤔 Подумайте й обговоріть!<small>Яку відповідь оберемо? Скажіть уголос!</small></div>
    </div>
    <div id="right"></div>
  </main>

  <footer>
    <button class="mc-btn honey" id="think">🤔 Як думаєте?</button>
    <div id="msg"></div>
    <button class="mc-btn green" id="next" hidden>Далі ➜</button>
  </footer>

  <div id="final" hidden>
    <h2>Пасіка гуде! Ви уважні програмісти!</h2>
    <canvas id="fcv" width="1000" height="480"></canvas>
    <div class="chips">
      <div class="chip">🎲 «Вибрати випадкове положення» — щоразу нове місце</div>
      <div class="chip">🔁 «Повторити» — скільки разів</div>
      <div class="chip">🧱 Блок стоїть · 🐝 моб живий</div>
    </div>
    <button class="mc-btn green" id="restart">🔄 Почати знову</button>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= МАСШТАБ 16:9 ================= */
const stage = $('#stage');
function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ================= ТЕКСТУРИ (генеруються в коді) ================= */
function makeCanvas(w, h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const pk = (R, a) => a[Math.floor(R() * a.length)];
function texture(w, h, seed, fn){
  const c = makeCanvas(w, h), g = c.getContext('2d'), R = mulberry32(seed);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){ g.fillStyle = fn(x, y, R); g.fillRect(x, y, 1, 1); }
  return c.toDataURL();
}
const DIRT  = ['#8B6142','#7A5338','#96694A','#6E4A31','#A87B55','#5E3F2A'];
const STONE = ['#7F7F7F','#757575','#888888','#6B6B6B','#929292','#7A7A7A'];
const GRASS = ['#5DA83A','#68B544','#529A31','#74C04E','#4D8F2E'];
const PLANK = ['#B08A55','#A27F4C','#BB955E','#9C7748'];
const drip = (() => { const R = mulberry32(99); return Array.from({length:16}, () => 3 + (R() < .5 ? 1 : 0) + (R() < .25 ? 1 : 0)); })();
const TEX = {
  dirt: texture(16,16,3,(x,y,R)=>pk(R,DIRT)),
  stone: texture(16,16,5,(x,y,R)=>pk(R,STONE)),
  grassSide: texture(16,16,9,(x,y,R)=>y<drip[x]?pk(R,GRASS):pk(R,DIRT)),
  planks: texture(16,16,11,(x,y,R)=>{const band=y>>2; if(y%4===3) return '#7A5A33'; if(x===(band%2?4:12)) return '#86653A'; return pk(R,PLANK);}),
};
for (const k in TEX) document.documentElement.style.setProperty('--' + k, `url(${TEX[k]})`);

/* ================= ПІКСЕЛЬНІ СПРАЙТИ (власний дизайн) ================= */
const SPR = {
  flower:[
    "g..PP..g",
    ".gPppPg.",
    ".PPppPP.",
    "PpPYYPpP",
    "PpPYoPpP",
    ".PPppPP.",
    ".gPppPg.",
    "g..PP..g"],
  hive:[
    "KKKKKKKK",
    "KHHyHHHK",
    "KhhhhhhK",
    "KHHddHHK",
    "KHHddHHK",
    "KhhhhhhK",
    "KHHHHHyK",
    "KKKKKKKK"],
  nest:[
    ".NNNNNN.",
    "NNnNNnNN",
    "NnNwNNnN",
    "NNNddNNN",
    "NNNddNwN",
    "NnNNNNnN",
    "NNnNNnNN",
    ".NNNNNN."],
  bee:[
    "..YYYKKYYKYY",
    ".dYYYKKYYKWE",
    "ddYYYKKYYKYE",
    ".dYYYKKYYKYY",
    "..OOOKKOOKOO",
    "...k...k..k."],
  wingsA:[
    "....ww.ww...",
    "...wwwwwwww.",
    "....ww.ww..."],
  wingsB:[
    "............",
    "...www.www..",
    "....wwwww..."],
  player:[
    "CCCCCCCC",
    "CCCCCCCV",
    "HHHHHHHH",
    "SSSSSSSS",
    "SESSSSES",
    "SSSSSSSS",
    "SSSmmSSS",
    "SSSSSSSS"],
};
const PAL = {
  pink:{P:'#F06BB0',p:'#C9478C',Y:'#FFD93B',o:'#E0A800',g:'#2F7D25'},
  blue:{P:'#5AA9F0',p:'#2F78C4',Y:'#FFF27A',o:'#E0B800',g:'#2F7D25'},
  hive:{K:'#5A3A12',H:'#F2B640',h:'#C98A22',d:'#2A1606',y:'#FFE27A'},
  nest:{N:'#E9C46A',n:'#A8762A',d:'#3B2207',w:'#FFF1B8'},
  bee:{Y:'#FFCE3A',O:'#D99A18',K:'#3B2A14',W:'#FFFFFF',E:'#111111',d:'#333333',k:'#222222',w:'rgba(225,242,255,.92)'},
  player:{C:'#E8742A',V:'#B5521A',H:'#6B4423',S:'#F1C27D',E:'#2B2B6B',m:'#A0522D'},
};
function sprite(g, rows, pal, x, y, size, flip){
  const w = rows[0].length, p = size / w;
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < w; c++){
    const ch = rows[r][c]; if (ch === '.') continue;
    g.fillStyle = pal[ch];
    const cc = flip ? (w - 1 - c) : c;
    g.fillRect(Math.floor(x + cc * p), Math.floor(y + r * p), Math.ceil(p), Math.ceil(p));
  }
}
// бджола: 12×9 (крила 3 рядки + тіло 6 рядків)
function drawBee(g, x, y, size, flip, frame){
  const p = size / 12;
  sprite(g, frame ? SPR.wingsB : SPR.wingsA, PAL.bee, x, y, size, flip);
  sprite(g, SPR.bee, PAL.bee, x, y + 3 * p, size, flip);
}

/* ================= ЗВУК (Web Audio) ================= */
const SFX = {
  ctx:null, muted:false, last:0, noiseBuf:null,
  ac(){
    if (this.muted) return null;
    if (!this.ctx){ try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, d, {type='square', vol=.07, at=0, to=null} = {}){
    const c = this.ac(); if (!c) return;
    const t0 = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + d + .03);
  },
  noise(d, {vol=.2, f1=2000, f2=300} = {}){
    const c = this.ac(); if (!c) return;
    if (!this.noiseBuf){
      this.noiseBuf = c.createBuffer(1, c.sampleRate * .5, c.sampleRate);
      const a = this.noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f1, t0); f.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    s.connect(f).connect(g).connect(c.destination); s.start(t0); s.stop(t0 + d + .02);
  },
  puff(){
    const n = performance.now(); if (n - this.last < 45) return; this.last = n;
    this.noise(.13, {vol:.28, f1:1400 + Math.random() * 900, f2:350});
    this.tone(500 + Math.random() * 250, .09, {type:'sine', vol:.05, to:950});
  },
  buzz(d = 1.4){
    const c = this.ac(); if (!c) return;
    const t0 = c.currentTime, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain();
    const am = c.createOscillator(), amg = c.createGain(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = 205;
    lfo.frequency.value = 7; lg.gain.value = 14; lfo.connect(lg).connect(o.frequency);
    am.frequency.value = 42; amg.gain.value = .35; am.connect(amg);
    f.type = 'lowpass'; f.frequency.value = 1100;
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.09, t0 + .15);
    g.gain.setValueAtTime(.09, t0 + d - .3); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    amg.connect(g.gain);
    o.connect(f).connect(g).connect(c.destination);
    [o, lfo, am].forEach(n => { n.start(t0); n.stop(t0 + d + .05); });
  },
  ok(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .2, {at:i * .09, vol:.07})); },
  bad(){ this.tone(330, .18, {type:'triangle', vol:.14}); this.tone(220, .32, {type:'triangle', vol:.14, at:.17}); },
  think(){ this.tone(440, .25, {type:'sine', vol:.09, to:540}); this.tone(540, .35, {type:'sine', vol:.09, at:.28, to:430}); },
  click(){ this.tone(900, .04, {vol:.04}); },
  flip(){ this.tone(600, .12, {type:'square', vol:.05, to:1200}); },
};
$('#mute').onclick = () => {
  SFX.muted = !SFX.muted;
  $('#mute').textContent = SFX.muted ? '🔇' : '🔊';
  if (SFX.ctx) SFX.muted ? SFX.ctx.suspend() : SFX.ctx.resume();
};

/* ================= ГАЛЯВИНА 12×12 ================= */
const N = 12, CELL = 40, M0 = 20, SIZE = N * CELL + 2 * M0, MID = 6; // ~0 ~0 ~0 = клітинка (6,6); зона ~-5..~5 = 1..11
const cv = $('#meadow'), cx = cv.getContext('2d');
const meadow = {cells:new Map(), zone:false, parts:[], rings:[], bees:[], tags:[], badge:null};
let now = performance.now();

function grassBG(w, h, seed, cell, fence){
  const c = makeCanvas(w, h), g = c.getContext('2d'), R = mulberry32(seed), px = 5;
  for (let y = 0; y < h; y += px) for (let x = 0; x < w; x += px){ g.fillStyle = pk(R, GRASS); g.fillRect(x, y, px, px); }
  if (fence){
    g.fillStyle = 'rgba(30,60,10,.35)'; // темніша смуга під парканом
    g.fillRect(0, 0, w, M0); g.fillRect(0, h - M0, w, M0); g.fillRect(0, 0, M0, h); g.fillRect(w - M0, 0, M0, h);
    g.strokeStyle = 'rgba(0,0,0,.13)'; g.lineWidth = 1;
    for (let i = 0; i <= N; i++){
      g.beginPath(); g.moveTo(M0 + i * cell + .5, M0); g.lineTo(M0 + i * cell + .5, h - M0); g.stroke();
      g.beginPath(); g.moveTo(M0, M0 + i * cell + .5); g.lineTo(w - M0, M0 + i * cell + .5); g.stroke();
    }
    // перекладини паркану
    g.fillStyle = '#7A4E24';
    g.fillRect(6, M0 / 2 - 3, w - 12, 6); g.fillRect(6, h - M0 / 2 - 3, w - 12, 6);
    g.fillRect(M0 / 2 - 3, 6, 6, h - 12); g.fillRect(w - M0 / 2 - 3, 6, 6, h - 12);
    g.fillStyle = '#A06C3A';
    g.fillRect(6, M0 / 2 - 3, w - 12, 2); g.fillRect(6, h - M0 / 2 - 3, w - 12, 2);
    g.fillRect(M0 / 2 - 3, 6, 2, h - 12); g.fillRect(w - M0 / 2 - 3, 6, 2, h - 12);
    // стовпчики
    const post = (x, y) => { g.fillStyle = '#3E2610'; g.fillRect(x - 7, y - 7, 14, 14); g.fillStyle = '#8B5A2B'; g.fillRect(x - 5, y - 5, 10, 10); g.fillStyle = '#B07A42'; g.fillRect(x - 5, y - 5, 10, 3); };
    for (let i = 0; i <= N; i++){
      const p = M0 + i * cell;
      post(p, M0 / 2); post(p, h - M0 / 2); post(M0 / 2, p); post(w - M0 / 2, p);
    }
    post(M0 / 2, M0 / 2); post(w - M0 / 2, M0 / 2); post(M0 / 2, h - M0 / 2); post(w - M0 / 2, h - M0 / 2);
  }
  return c;
}
const BG = grassBG(SIZE, SIZE, 21, CELL, true);

const cellPx = (x, y) => [M0 + x * CELL, M0 + y * CELL];
const zoneCells = () => { const a = []; for (let y = 1; y <= 11; y++) for (let x = 1; x <= 11; x++) a.push([x, y]); return a; };
const rndCell = () => [MID + ri(-5, 5), MID + ri(-5, 5)]; // строго в межах ~-5..~5
const distinct = k => shuffle(zoneCells()).slice(0, k);

function mReset(){ meadow.cells.clear(); meadow.zone = false; meadow.parts = []; meadow.rings = []; meadow.bees = []; meadow.tags = []; meadow.badge = null; }
function puffAt(x, y, n = 8){
  const [px, py] = cellPx(x, y);
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 70;
    meadow.parts.push({x:px + CELL / 2, y:py + CELL / 2, vx:Math.cos(a) * v, vy:Math.sin(a) * v, s:5 + Math.random() * 6, t:now, life:420 + Math.random() * 200});
  }
}
function put(x, y, kind, {anim = true, sound = true, puff = 8} = {}){
  meadow.cells.set(x + ',' + y, {kind, t:anim ? now : -1e9});
  if (anim){ if (puff) puffAt(x, y, puff); if (sound) SFX.puff(); }
}
function spawnBee(x, y, tag){
  const [px, py] = cellPx(x, y);
  const b = {x:px + 2, y:py + 2, tx:px, ty:py, flip:false, tag, t:now, speed:110 + Math.random() * 40};
  newTarget(b); meadow.bees.push(b); puffAt(x, y, 10); SFX.puff(); SFX.buzz(1.6);
  return b;
}
function newTarget(b){ b.tx = M0 + 10 + Math.random() * (N * CELL - 56); b.ty = M0 + 10 + Math.random() * (N * CELL - 56); }
const easeBack = k => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

function drawLabel(g, text, x, y, bg = '#fff', fg = '#222', font = 'bold 17px "Segoe UI",Arial', W = SIZE){
  g.font = font; const w = g.measureText(text).width + 14, h = 26;
  x = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, x)); y = Math.max(h / 2 + 4, Math.min(SIZE - h / 2 - 4, y));
  g.fillStyle = '#000'; g.fillRect(x - w / 2 - 2, y - h / 2 - 2, w + 4, h + 4);
  g.fillStyle = bg; g.fillRect(x - w / 2, y - h / 2, w, h);
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, x, y + 1);
}
function drawItem(g, o, x, y){
  const [px, py] = cellPx(x, y);
  const k = Math.min(1, (now - o.t) / 240), s = k >= 1 ? 1 : Math.max(.05, easeBack(k));
  g.save(); g.translate(px + CELL / 2, py + CELL / 2); g.scale(s, s);
  if (o.kind === 'pink' || o.kind === 'blue') sprite(g, SPR.flower, PAL[o.kind], -16, -16, 32);
  else if (o.kind === 'hive') sprite(g, SPR.hive, PAL.hive, -19, -19, 38);
  else if (o.kind === 'nest') sprite(g, SPR.nest, PAL.nest, -19, -19, 38);
  g.restore();
}
function drawMeadow(dt){
  const g = cx;
  g.drawImage(BG, 0, 0);
  if (meadow.zone){
    g.save(); g.setLineDash([10, 7]); g.lineDashOffset = -now / 40; g.strokeStyle = '#FFE066'; g.lineWidth = 3;
    g.strokeRect(M0 + CELL + 1.5, M0 + CELL + 1.5, 11 * CELL - 3, 11 * CELL - 3); g.restore();
  }
  // гравець у точці ~0 ~0 ~0
  const [ppx, ppy] = cellPx(MID, MID);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2; g.strokeRect(ppx + 1, ppy + 1, CELL - 2, CELL - 2);
  for (const [key, o] of meadow.cells){ const [x, y] = key.split(',').map(Number); drawItem(g, o, x, y); }
  sprite(g, SPR.player, PAL.player, ppx - 6, ppy - 6, 20);
  for (const r of meadow.rings){
    const [px, py] = cellPx(r.x, r.y), a = .6 + .4 * Math.sin(now / 120);
    g.globalAlpha = a; g.strokeStyle = r.color; g.lineWidth = 4; g.strokeRect(px - 2, py - 2, CELL + 4, CELL + 4); g.globalAlpha = 1;
    if (r.label) drawLabel(g, r.label, px + CELL / 2, py - 16, r.color, '#111');
  }
  for (const t of meadow.tags){ const [px, py] = cellPx(t.x, t.y); drawLabel(g, t.text, px + CELL / 2, py + CELL + 14, '#fff', '#333', 'bold 16px "Segoe UI",Arial'); }
  if (meadow.badge){ const [px, py] = cellPx(meadow.badge.x, meadow.badge.y); drawLabel(g, meadow.badge.text, px + CELL / 2, py + CELL + 16, '#FFE14D', '#111', 'bold 20px "Segoe UI",Arial'); }
  for (const b of meadow.bees){
    const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
    if (d < 4) newTarget(b); else { const st = Math.min(d, b.speed * dt / 1000); b.x += dx / d * st; b.y += dy / d * st; if (Math.abs(dx) > 2) b.flip = dx < 0; }
    const bob = Math.sin(now / 140) * 3;
    g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(b.x + 22, b.y + 44, 15, 5, 0, 0, Math.PI * 2); g.fill();
    drawBee(g, b.x, b.y + bob, 44, b.flip, Math.floor(now / 70) % 2);
    if (b.tag) drawLabel(g, b.tag, b.x + 22, b.y - 12 + bob, '#E2C9FF', '#3a1a6a', 'bold 16px "Segoe UI",Arial');
  }
  meadow.parts = meadow.parts.filter(p => now - p.t < p.life);
  for (const p of meadow.parts){
    const k = (now - p.t) / p.life, s = p.s * (1 - k * .5);
    g.globalAlpha = 1 - k; g.fillStyle = k < .3 ? '#FFFFFF' : '#DDDDDD';
    g.fillRect(p.x + p.vx * k - s / 2, p.y + p.vy * k - s / 2, s, s);
  }
  g.globalAlpha = 1;
}

{

  code:() => cblock(20, B.placeRnd('🌸')) + `<div class="runtag">▶ запуск №2</div>`,
  options:[card('Точно на тих самих місцях, що й перші'), card('В інших випадкових місцях'), card('Нові квіти не з’являться, бо галявина вже зайнята')],
  first:[],

    'Нові (сині) квіти виросли здебільшого в ІНШИХ місцях — лише кілька випадково збіглися зі старими.',
    '',
    'Нові квіти з’явилися! А якщо місце зайняте, нова квітка просто стає замість старої.'],
  ok:'Щоразу комп’ютер обирає нові випадкові місця, тому кожен запуск дає інший луг.',
},
/* ---------- 3А. Блок чи моб ---------- */
{
  label:'Питання 3 / 4', tag:'Питання 3 · Блок чи моб? · частина А', bee:null, correct:0, nextText:'Частина Б ➜',
  q:'Чим «створити тварину» відрізняється від «розмістити блок»?',
  options:[card('Тварина жива: вона рухається сама, а блок стоїть на місці'), card('Тварину можна поставити тільки руками, а не кодом'), card('Різниці немає, це дві назви однієї команди')],
  base(){
    mReset(); put(3, 3, 'hive', {anim:false}); put(9, 4, 'pink', {anim:false}); put(4, 9, 'pink', {anim:false});
    meadow.tags = [{x:3, y:3, text:'блок'}, {x:9, y:4, text:'блок'}];
  },
  setup(){ this.base(); setCounter('Вулик і квітка — <b>блоки</b>. А що з бджолою?'); },
  async play(i, tok){
    this.base(); setCounter('Код: <b>створити тварину 🐝</b>…'); await wait(500, tok);
    spawnBee(MID, MID, 'моб');
    setCounter('🧱 блоки стоять на місці · 🐝 моб літає <b>сам</b>');
    await wait(2200, tok);
  },
  why:[
    '',
    'Дивіться: бджолу щойно створив КОД командою «створити тварину»!',
    'Різниця є: вулик і квітка стоять на місці, а бджола літає сама!'],
  ok:'Тварина (моб) жива і рухається сама, а блок стоїть на місці.',
},
/* ---------- 3Б. Гніздо ---------- */
{
  label:'Питання 3 / 4', tag:'Питання 3 · Блок чи моб? · частина Б', bee:2, correct:0,
  q:'А якою командою поставити бджолине гніздо?',
  options:[B.place0('🪺'), B.spawn0('🐝')],
  base(){ mReset(); put(2, 9, 'pink', {anim:false}); put(10, 3, 'pink', {anim:false}); put(9, 10, 'pink', {anim:false}); },
  setup(){ this.base(); setCounter('Ставимо гніздо в точку <b>~0 ~0 ~0</b>'); },
  async play(i, tok){
    this.base(); await wait(350, tok);
    if (i === 0){
      put(MID, MID, 'nest'); meadow.tags = [{x:MID, y:MID, text:'блок'}];
      setCounter('🪺 Гніздо стоїть на місці — це <b>блок</b>');
      await wait(900, tok);
    } else {
      spawnBee(MID, MID, 'моб');
      setCounter('З’явилась жива бджола, а <b>гнізда немає</b> 🤷');
      await wait(1800, tok);
    }
  },
  why:['', 'З’явилася жива бджола, а гнізда немає! Гніздо — це не тварина.'],
  ok:'Гніздо — це блок, а бджола — моб. Хоч обидва про бджіл!',
},
/* ---------- 4а. Правда чи хиба ---------- */
{
  label:'Питання 4 / 4', tag:'Питання 4 · Правда чи хиба? · твердження 1 з 2', bee:null, correct:0, tf:true, nextText:'Твердження 2 ➜',
  q:'«Чим більше число в циклі „повторити“, тим більше разів виконається дія»',
  code:() => cblock(3, B.placeRnd('🌸'), 'repn'),
  setup(){ mReset(); meadow.zone = true; setCounter('Правда чи хиба? Перевіримо на галявині!'); },
  async play(i, tok){
    const nEl = $('#repn');
    mReset(); meadow.zone = true; nEl.textContent = '3';
    let cells = distinct(3);
    for (let k = 0; k < 3; k++){ put(cells[k][0], cells[k][1], 'pink'); setCounter(`повторити <b>3</b> → квіток: <b>${k + 1}</b>`); await wait(420, tok); }
    await wait(700, tok);
    nEl.classList.add('bump'); SFX.flip(); nEl.textContent = '10'; await wait(550, tok); nEl.classList.remove('bump');
    mReset(); meadow.zone = true; cells = distinct(10);
    for (let k = 0; k < 10; k++){ put(cells[k][0], cells[k][1], 'pink'); setCounter(`повторити 3 → <b>3</b> · повторити <b>10</b> → квіток: <b>${k + 1}</b>`); await wait(240, tok); }
    setCounter('повторити 3 → <b>3</b> квітки · повторити 10 → <b>10</b> квіток 🌸');
    await wait(250, tok);
  },
  why:['', 'Подивіться: 3 повтори — 3 квітки, 10 повторів — 10 квіток. Більше число — більше разів!'],
  ok:'Число в «повторити» каже, скільки разів виконати дію: більше число — більше разів.',
},
/* ---------- 4б. Правда чи хиба ---------- */
{
  label:'Питання 4 / 4', tag:'Питання 4 · Правда чи хиба? · твердження 2 з 2', bee:3, correct:1, tf:true, nextText:'Фініш 🏁',
  q:'«Якщо цикл з випадковим положенням виконався 10 разів, на галявині ЗАВЖДИ буде видно рівно 10 квіток»',
  code:() => cblock(10, B.placeRnd('🌸')),
  setup(){ mReset(); meadow.zone = true; setCounter('Правда чи хиба? Рахуємо разом!'); },
  async play(i, tok){
    mReset(); meadow.zone = true;
    // 9 різних клітинок + гарантований збіг: одна квітка падає туди, де вже є квітка
    const cells = distinct(9), k = ri(5, 8), dup = cells[ri(0, k - 1)];
    const seq = [...cells.slice(0, k), dup, ...cells.slice(k)];
    for (let n = 0; n < 10; n++){
      const [x, y] = seq[n];
      put(x, y, 'pink');
      if (n === k){
        meadow.rings.push({x, y, color:'#FF5A4E', label:'сюди вже падала!'});
        meadow.badge = {x, y, text:'×2'}; SFX.bad();
      }
      setCounter(`запусків: <b>${n + 1}</b> · квіток видно: <b>${meadow.cells.size}</b>`);
      await wait(n === k ? 1100 : 450, tok);
    }
    setCounter('запусків: <b>10</b>, квіток видно: <b>9</b>');
    await wait(250, tok);
  },
  why:['Вийшло: запусків 10, а квіток видно 9 — дві квітки впали в одну клітинку!', ''],
  ok:'Випадкове місце може випасти двічі. Тоді друга квітка стає на місце першої.',
},
/* ---------- ФІНАЛ ---------- */
{label:'Фінал', final:true},
];

/* ================= ЛОГІКА ЕКРАНІВ ================= */
let cur = 0, busy = false, solved = false, optEls = [];
const right = $('#right'), msg = $('#msg'), nextBtn = $('#next'), thinkBtn = $('#think'), bubble = $('#bubble');
const LETTERS = ['А', 'Б', 'В'];
const setMsg = (h, cls = '') => { msg.innerHTML = h; msg.className = cls; };

function render(){
  const s = STEPS[cur];
  $('#steplabel').textContent = s.label;
  bubble.hidden = true; right.classList.remove('thinking');
  if (s.final){ showFinal(); return; }
  $('#final').hidden = true;
  $('#qtag').textContent = s.tag;
  $('#qtext').textContent = s.q;
  const opts = s.tf
    ? [`<div class="tf yes">Правда ✅</div>`, `<div class="tf no">Хиба ❌</div>`]
    : s.options;
  right.innerHTML =
    (s.code ? `<div class="code">${s.code()}</div>` : '') +
    `<div class="opts${s.tf ? ' row' : ''}">` +
    opts.map((o, i) => `<div class="opt" data-i="${i}" role="button">${s.tf ? '' : `<span class="letter">${LETTERS[i]}</span>`}${o}</div>`).join('') +
    `</div>`;
  optEls = [...right.querySelectorAll('.opt')];
  optEls.forEach((el, i) => el.onclick = () => choose(i));
  s.setup();
  thinkBtn.hidden = false; nextBtn.hidden = true;
  setMsg('Скажіть відповідь уголос — викладач натисне 🖱️');
}

async function choose(i){
  const s = STEPS[cur];
  if (busy || solved || s.final || !optEls[i]) return;
  const el = optEls[i];
  bubble.hidden = true; right.classList.remove('thinking');
  busy = true; const tok = ++token;
  optEls.forEach(o => o.classList.remove('trying'));
  el.classList.remove('wrong'); el.classList.add('trying'); SFX.click();
  setMsg('👀 Дивимось, що станеться на галявині…');
  try { await s.play(i, tok); }
  catch (e){ if (e === CANCEL) return; throw e; }
  if (tok !== token) return;
  busy = false;
  el.classList.remove('trying');
  if (i === s.correct){
    solved = true;
    el.classList.add('correct'); optEls.forEach(o => { if (o !== el) o.classList.add('dim'); });
    SFX.ok();
    setMsg(`<span>✅ <b>Так!</b> ${s.ok}</span>`, 'ok');
    if (s.bee != null) setTimeout(() => { if (tok === token) wakeBee(s.bee); }, 350);
    thinkBtn.hidden = true;
    nextBtn.textContent = s.nextText || 'Далі ➜'; nextBtn.hidden = false;
  } else {
    el.classList.add('wrong'); SFX.bad();
    setMsg(`<b>Вийшло інакше! Подивіться 👀</b><span class="sub">${s.why[i]} Можна обрати ще раз.</span>`, 'bad');
  }
}

function go(i){
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  token++; busy = false; solved = false; cur = i;
  render();
}
function restart(){ progress.fill(false); syncProgress(); go(0); }

thinkBtn.onclick = () => {
  const on = bubble.hidden;
  bubble.hidden = !on; right.classList.toggle('thinking', on);
  if (on){ SFX.think(); setMsg('🤔 Час подумати й обговорити! Яку відповідь оберемо?'); }
};
nextBtn.onclick = () => go(cur + 1);
$('#restart').onclick = restart;

addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'ArrowRight'){ e.preventDefault(); if (cur < STEPS.length - 1) go(cur + 1); }
  else if (e.code === 'ArrowLeft'){ e.preventDefault(); if (cur > 0) go(cur - 1); }
  else if (e.code === 'KeyR'){ restart(); }
  else if (/^(Digit|Numpad)[1-3]$/.test(e.code)){ choose(+e.code.slice(-1) - 1); }
});

/* ================= ФІНАЛ ================= */
const fcv = $('#fcv'), fg = fcv.getContext('2d');
const FBG = (() => {
  const c = grassBG(1000, 480, 33, 40, false), g = c.getContext('2d'), R = mulberry32(5);
  for (let i = 0; i < 46; i++){
    const x = 20 + R() * 950, y = 20 + R() * 430;
    if (Math.abs(x - 500) < 110 && Math.abs(y - 240) < 100) continue;
    sprite(g, SPR.flower, R() < .5 ? PAL.pink : PAL.blue, x, y, 32);
  }
  return c;
})();
function showFinal(){
  $('#final').hidden = false; thinkBtn.hidden = true; nextBtn.hidden = true;
  SFX.buzz(2.2); setTimeout(SFX.ok.bind(SFX), 300);
}
function drawFinal(){
  fg.drawImage(FBG, 0, 0);
  fg.fillStyle = 'rgba(0,0,0,.25)'; fg.fillRect(445, 250, 110, 16);
  sprite(fg, SPR.hive, PAL.hive, 445, 150, 110);
  for (let i = 0; i < 4; i++){
    const sp = .0011 + i * .00012, a = now * sp + i * Math.PI / 2;
    const rx = 220 + i * 45, ry = 120 + (i % 2) * 40;
    const x = 500 + Math.cos(a) * rx - 30, y = 205 + Math.sin(a) * ry - 30 + Math.sin(now / 160 + i) * 6;
    fg.fillStyle = 'rgba(0,0,0,.2)'; fg.beginPath(); fg.ellipse(x + 30, y + 72, 18, 5, 0, 0, Math.PI * 2); fg.fill();
    drawBee(fg, x, y, 60, Math.sin(a) > 0, Math.floor(now / 60) % 2);
  }
}

/* ================= ГОЛОВНИЙ ЦИКЛ ================= */
let last = performance.now();
function loop(t){
  const dt = Math.min(50, t - last); last = t; now = t;
  drawMeadow(dt); drawPBees();
  if (!$('#final').hidden) drawFinal();
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
</script>
